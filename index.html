<style>

  </div>
  <div class="topbar-right">

    <button class="btn-top" onclick="downloadCSV()">📥 CSV</button>
    <button class="btn-top" onclick="toggleFullscreen()">🖥️ 전체</button>
    <button class="btn-top danger" onclick="resetDay()">⏹️ 마감</button>
  </div>
</div>

<div id="summary"></div>

  <div class="grid-wrap" id="grid"></div>
</div>

<div id="modal-wrap"></div>

  <button class="stats-close" onclick="closeStats()">✕</button>
  <div id="stats-content"></div>
</div>

<div id="toast"></div>

<script>
const TECHS = [
  '손홍철', '이춘기', '강준구', '이성규', '배병수', '곽재훈',
  '박주창', '석병수', '최태현', '이진희', '맹성환', '전호원'
];

let state = null;
let startTimes = {};

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function loadState() {
  const today = todayStr();
  const saved = localStorage.getItem(`bh_state_${today}`);
  if (saved) {
    return JSON.parse(saved);
  }
  return {
    techs: TECHS.map(name => ({ name, active: null, done: [] }))
  };
}

async function loadFromFirestore() {
  const today = todayStr();
  
  try {
    const doc = await db.collection('work_data').doc(today).get();
    if (doc.exists) {
      const data = doc.data();
      state = data.state;
      startTimes = data.startTimes || {};
      render();
      console.log('✅ Firestore에서 로드 완료');
    } else {
      console.log('Firestore 데이터 없음, 로컬 데이터 사용');
      state = loadState();
    }
  } catch(e) {
    console.error('Firestore 로드 실패:', e);
    state = loadState();
  }
}

function startFirestoreSync() {
  const today = todayStr();
  
  db.collection('work_data').doc(today).onSnapshot((doc) => {
    if (doc.exists) {
      const data = doc.data();
      state = data.state;
      startTimes = data.startTimes || {};
      render();
      console.log('🔄 Firestore 실시간 동기화됨');
    }
  }, (error) => {
    console.error('❌ Firestore 리스너 오류:', error);
  });
}

// 🆕 방법 3: 수동 새로고침 함수
async function refreshData() {
  const today = todayStr();
  try {
    console.log('🔄 수동 새로고침 시작...');
    const doc = await db.collection('work_data').doc(today).get();
    if (doc.exists) {
      const data = doc.data();
      state = data.state;
      startTimes = data.startTimes || {};
      render();
      console.log('✅ 수동 새로고침 완료');
      toast('✅ 새로고침 완료');
    } else {
      console.log('⚠️ Firestore에 데이터 없음');
      toast('⚠️ 데이터 없음');
    }
  } catch(e) {
    console.error('❌ 수동 새로고침 실패:', e);
    toast('❌ 새로고침 실패: ' + e.message);
  }
}

async function saveState() {
  const today = todayStr();
  
  localStorage.setItem(`bh_state_${today}`, JSON.stringify(state));
  
  try {
    await db.collection('work_data').doc(today).set({
      state: state,
      startTimes: startTimes,
      timestamp: new Date()
    });
    console.log('✅ Firestore 저장 완료');
  } catch(e) {
    console.error('Firestore 저장 실패:', e);
  }
}

function updateSummary() {
  if (!state) return;
  const totalCars = state.techs.reduce((a, t) => a + t.done.length, 0);
  const activeCars = state.techs.filter(t => t.active).length;
  
  let html = `
    <div class="sum-card">
      <div class="sum-label">작업 중</div>
      <div class="sum-val green">${activeCars}</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">완료</div>
      <div class="sum-val blue">${totalCars}</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">가용 기사</div>
      <div class="sum-val">${TECHS.length - activeCars}</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">평균 시간</div>
      <div class="sum-val yellow">${totalCars > 0 ? fmtMin(state.techs.reduce((a,t) => a + t.done.reduce((a2,d) => a2+d.sec, 0), 0) / totalCars) : '-'}</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">총 시간</div>
      <div class="sum-val">${fmtMin(state.techs.reduce((a,t) => a + t.done.reduce((a2,d) => a2+d.sec, 0), 0))}</div>
    </div>
  `;
  document.getElementById('summary').innerHTML = html;
}

function render() {
  if (!state) return;
  updateSummary();
  let html = '';
  state.techs.forEach((tech, idx) => {
    const isActive = tech.active !== null;
    const statusClass = isActive ? (
      (tech.active.car.includes('휴무') || tech.active.work.includes('휴무')) ? 'status-off' :
      (tech.active.car.includes('하루') || tech.active.work.includes('하루')) ? 'status-day' : ''
    ) : '';
    
    html += `<div class="tech-card ${isActive ? 'has-active' : ''} ${statusClass}">
      <div class="tech-header">
        <div class="tech-avatar ${isActive ? 'active' : ''}">${tech.name[0]}</div>
        <div class="tech-name">${tech.name}</div>
        <div class="tech-total ${isActive ? 'has-jobs' : ''}">${tech.done.length}</div>
      </div>`;
    
    if (isActive) {
      const statusActiveClass = (tech.active.car.includes('휴무') || tech.active.work.includes('휴무')) ? 'status-off' :
        (tech.active.car.includes('하루') || tech.active.work.includes('하루')) ? 'status-day' : '';
      html += `<div class="active-slot ${statusActiveClass}">
        <div class="active-content">
          <div class="active-left">
            <div class="active-row1">
              <div class="active-dot"></div>
              <div class="active-car">${tech.active.car}</div>
            </div>
            <div class="active-work">${tech.active.work}</div>
          </div>
          <div class="active-right">
            <div class="active-eta-label">목표</div>
            <select class="active-eta-sel" onchange="setETA(${idx}, this.value)">
              <option value="10" ${tech.active.eta === 10 ? 'selected' : ''}>10분</option>
              <option value="15" ${tech.active.eta === 15 ? 'selected' : ''}>15분</option>
              <option value="20" ${tech.active.eta === 20 ? 'selected' : ''}>20분</option>
              <option value="30" ${tech.active.eta === 30 ? 'selected' : ''}>30분</option>
              <option value="60" ${tech.active.eta === 60 ? 'selected' : ''}>1시간</option>
            </select>
            <div class="active-eta-val" id="eta-${idx}">${fmtMin(tech.active.eta * 60 - ((Date.now() - startTimes[tech.name]) / 1000))}</div>
            <div class="active-timer" id="timer-${idx}"></div>
          </div>
        </div>
        <button onclick="finishJob(${idx})" style="margin-top:10px;width:100%;padding:8px;background:var(--active-border);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;transition:background .15s">✓ 완료</button>
        <button onclick="removeJob(${idx})" style="margin-top:6px;width:100%;padding:6px;background:rgba(248,81,73,0.2);color:#f85149;border:1px solid rgba(248,81,73,0.5);border-radius:6px;cursor:pointer;font-size:12px;transition:background .15s">✕ 취소</button>
      </div>`;
    } else {
      html += `<button class="add-car-btn" onclick="newJob(${idx})">+ 차량 등록</button>`;
    }
    
    html += `<div class="done-list" id="done-${idx}">`;
    tech.done.forEach((job, jidx) => {
      html += `<div class="done-item">
        <div class="done-num">${jidx+1}</div>
        <div class="done-body">
          <div class="done-car">${job.car}</div>
          <div class="done-work">${job.work}</div>
          <div class="done-meta">${job.startTime} ~ ${job.endTime}</div>
        </div>
        <div class="done-right">
          <div class="done-time-badge">${fmtMin(job.sec)}</div>
          <button class="edit-btn" onclick="delJob(${idx}, ${jidx})">삭제</button>
        </div>
      </div>`;
    });
    html += `</div>`;
    
    if (tech.done.length > 0) {
      html += `<button class="toggle-done-btn" onclick="toggleDone(${idx})">▼ ${tech.done.length}건 보기</button>`;
    }
    
    html += `</div>`;
  });
  document.getElementById('grid').innerHTML = html;
  document.getElementById('date-display').textContent = new Date().toLocaleDateString('ko-KR', { weekday: 'long', month: 'short', day: 'numeric' });
}

function updateTimers() {
  state.techs.forEach((tech, idx) => {
    if (tech.active) {
      const now = Date.now();
      const elapsed = (now - startTimes[tech.name]) / 1000;
      const remaining = tech.active.eta * 60 - elapsed;
      const etaEl = document.getElementById(`eta-${idx}`);
      const timerEl = document.getElementById(`timer-${idx}`);
      if (etaEl) etaEl.textContent = fmtMin(Math.max(0, remaining));
      if (timerEl) {
        const hrs = Math.floor(elapsed / 3600);
        const mins = Math.floor((elapsed % 3600) / 60);
        const secs = Math.floor(elapsed % 60);
        timerEl.textContent = `${hrs}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
      }
    }
  });
}

function updateClock() {
  const now = new Date();
  const hrs = String(now.getHours()).padStart(2,'0');
  const mins = String(now.getMinutes()).padStart(2,'0');
  const secs = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${hrs}:${mins}:${secs}`;
}

function fmtMin(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}

function newJob(idx) {
  const html = `
    <div id="mo" class="modal-wrap" onclick="bgClose(event)" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100">
      <div class="modal">
        <div class="modal-title">🚗 차량 등록</div>
        <input type="text" id="car-input" placeholder="차량번호 (예: 12가 3456)" class="modal-input" onkeypress="if(event.key==='Enter') addJob(${idx})">
        <input type="text" id="work-input" placeholder="작업내용 (예: 엔진오일 교환)" class="modal-input" onkeypress="if(event.key==='Enter') addJob(${idx})">
        <div class="modal-buttons">
          <button class="btn-secondary" onclick="closeModal()">취소</button>
          <button class="btn-primary" onclick="addJob(${idx})">등록</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modal-wrap').innerHTML = html;
  document.getElementById('car-input').focus();
}

function addJob(idx) {
  const car = document.getElementById('car-input').value.trim();
  const work = document.getElementById('work-input').value.trim();
  if (!car || !work) { toast('차량번호와 작업내용을 입력하세요'); return; }
  
  state.techs[idx].active = {
    car, work, eta: 20, startTime: new Date().toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'})
  };
  startTimes[state.techs[idx].name] = Date.now();
  closeModal();
  render();
  saveState();
  toast(`${state.techs[idx].name}이(가) 작업을 시작했습니다`);
}

function finishJob(idx) {
  const job = state.techs[idx].active;
  if (!job) return;
  const sec = (Date.now() - startTimes[state.techs[idx].name]) / 1000;
  job.endTime = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'});
  job.sec = Math.round(sec);
  state.techs[idx].done.push(job);
  state.techs[idx].active = null;
  render();
  saveState();
  toast(`${state.techs[idx].name}: ${job.car} (${fmtMin(sec)}) 완료`);
}

function removeJob(idx) {
  if (!state.techs[idx].active) return;
  state.techs[idx].active = null;
  render();
  saveState();
  toast('작업이 취소되었습니다');
}

function delJob(idx, jidx) {
  state.techs[idx].done.splice(jidx, 1);
  render();
  saveState();
}

function setETA(idx, val) {
  if (state.techs[idx].active) {
    state.techs[idx].active.eta = parseInt(val);
    saveState();
  }
}

function toggleDone(idx) {
  const el = document.getElementById(`done-${idx}`);
  el.classList.toggle('expanded');
}

function resetDay() {
  if (!confirm('마감하시겠습니까? (CSV 다운로드 + 데이터 초기화)')) return;
  downloadCSV();
  const today = todayStr();
  localStorage.setItem(`bh_archive_${today}`, JSON.stringify({ date: today, data: state }));
  
  db.collection('work_data').doc(today).delete().then(() => {
    console.log('Firestore 데이터 삭제됨');
  });
  
  state = loadState();
  startTimes = {};
  render();
  toast('마감 완료');
}

function downloadCSV() {
  const today = todayStr();
  const data = [];
  
  data.push(['정비 현황 리포트']);
  data.push(['날짜', today]);
  data.push([]);
  data.push(['기사별 통계']);
  data.push(['기사명', '완료 대수', '평균 시간', '총 시간']);
  
  state.techs.forEach(t => {
    if (t.done.length > 0) {
      const totalSec = t.done.reduce((a, d) => a + d.sec, 0);
      const avgSec = totalSec / t.done.length;
      data.push([
        t.name,
        t.done.length,
        fmtMin(avgSec),
        fmtMin(totalSec)
      ]);
    }
  });
  
  const totalCars = state.techs.reduce((a, t) => a + t.done.length, 0);
  const totalSeconds = state.techs.reduce((a, t) => a + t.done.reduce((a2, d) => a2 + d.sec, 0), 0);
  data.push([]);
  data.push(['합계', totalCars, fmtMin(totalSeconds / Math.max(totalCars, 1)), fmtMin(totalSeconds)]);
  
  data.push([]);
  data.push(['상세 작업 내역']);
  data.push(['기사명', '차량번호', '작업내용', '시작시간', '완료시간', '작업시간']);
  
  state.techs.forEach(t => {
    t.done.forEach(d => {
      data.push([
        t.name,
        d.car,
        d.work,
        d.startTime,
        d.endTime,
        fmtMin(d.sec)
      ]);
    });
  });
  
  const csv = data.map(row => 
    row.map(cell => {
      if (typeof cell === 'string' && (cell.includes(',') || cell.includes('"') || cell.includes('\n'))) {
        return `"${cell.replace(/"/g, '""')}"`;
      }
      return cell;
    }).join(',')
  ).join('\n');
  
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.setAttribute('href', url);
  link.setAttribute('download', `정비현황_${today}.csv`);
  link.click();
  URL.revokeObjectURL(url);
}

function openStats() {
  if (!state) return;
  const panel = document.getElementById('stats-panel');
  
  let html = `<div class="stats-title">📊 작업 통계</div>`;
  
  html += `
  <div style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
    <select id="stats-month" onchange="updateMonthStats()" style="padding:8px 12px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:13px">
      <option value="today">📅 오늘</option>
      <option value="month" selected>📊 이번 달</option>
      <option value="last-month">📆 지난 달</option>
    </select>
  </div>
  <div id="stats-content-inner"></div>`;
  
  document.getElementById('stats-content').innerHTML = html;
  updateMonthStats();
  panel.classList.add('open');
}

function updateMonthStats() {
  const selectEl = document.getElementById('stats-month');
  const period = selectEl.value;
  
  let data = [];
  let periodName = '';
  
  if (period === 'today') {
    data = [{ date: todayStr(), data: state }];
    const d = new Date();
    periodName = d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
  } else if (period === 'month') {
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth() + 1;
    
    for (let day = 1; day <= 31; day++) {
      const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const archiveKey = `bh_archive_${dateStr}`;
      const archived = localStorage.getItem(archiveKey);
      if (archived) {
        data.push(JSON.parse(archived));
      }
    }
    periodName = `${new Date().getFullYear()}년 ${month}월`;
  } else if (period === 'last-month') {
    const now = new Date();
    now.setMonth(now.getMonth() - 1);
    const year = now.getFullYear();
    const month = now.getMonth() + 1;
    
    for (let day = 1; day <= 31; day++) {
      const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const archiveKey = `bh_archive_${dateStr}`;
      const archived = localStorage.getItem(archiveKey);
      if (archived) {
        data.push(JSON.parse(archived));
      }
    }
    periodName = `${year}년 ${month}월`;
  }
  
  renderMonthStats(data, periodName);
}

function renderMonthStats(data, periodName) {
  if (data.length === 0) {
    document.getElementById('stats-content-inner').innerHTML = '<div style="color:var(--text3);text-align:center;padding:30px;font-size:14px">데이터가 없습니다</div>';
    return;
  }
  
  const techStats = {};
  TECHS.forEach(t => techStats[t] = { done: 0, sec: 0 });
  
  data.forEach(d => {
    const stateData = d.data || d;
    if (stateData.techs) {
      stateData.techs.forEach(t => {
        if (!techStats[t.name]) techStats[t.name] = { done: 0, sec: 0 };
        techStats[t.name].done += t.done.length;
        t.done.forEach(item => {
          techStats[t.name].sec += item.sec;
        });
      });
    }
  });
  
  const sorted = Object.entries(techStats)
    .sort((a, b) => b[1].done - a[1].done)
    .filter(([name, stats]) => stats.done > 0);
  
  const totalDone = sorted.reduce((a, [, s]) => a + s.done, 0);
  const totalSec = sorted.reduce((a, [, s]) => a + s.sec, 0);
  
  let html = `<div class="stats-sub">${periodName} — 총 ${data.length}일, ${totalDone}대, 평균 ${totalDone > 0 ? fmtMin(Math.round(totalSec/totalDone)) : '-'}</div>`;
  
  html += `<div class="stats-grid">`;
  sorted.slice(0, 4).forEach(([name, stats]) => {
    html += `<div class="sum-card">
      <div class="sum-label">${name}</div>
      <div class="sum-val" style="font-size:22px">${stats.done}대</div>
      <div style="font-size:11px;color:var(--text3);margin-top:2px">평균 ${fmtMin(Math.round(stats.sec/stats.done))}</div>
    </div>`;
  });
  html += `</div>`;
  
  html += `<table class="stats-table"><thead><tr>
    <th>순위</th><th>기사명</th><th>완료 대수</th><th>평균 시간</th>
  </tr></thead><tbody>`;
  
  sorted.forEach(([name, stats], idx) => {
    html += `<tr>
      <td><span style="display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--border);text-align:center;line-height:24px;font-weight:600;font-size:11px">${idx+1}</span></td>
      <td style="font-weight:700">${name}</td>
      <td style="font-family:var(--mono);color:var(--accent2)">${stats.done}대</td>
      <td style="font-family:var(--mono)">${fmtMin(Math.round(stats.sec/stats.done))}</td>
    </tr>`;
  });
  
  html += `</tbody></table>`;
  
  document.getElementById('stats-content-inner').innerHTML = html;
}

function closeStats() {
  document.getElementById('stats-panel').classList.remove('open');
}

function closeModal() { document.getElementById('modal-wrap').innerHTML = ''; }
function bgClose(e) { if (e.target.id === 'mo') closeModal(); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

state = loadState();

// Firestore에서 데이터 로드
loadFromFirestore();

// Firestore 실시간 동기화 시작
startFirestoreSync();

// 🆕 방법 1: 매초 자동 새로고침 (모든 PC 동기화)
setInterval(async () => {
  const today = todayStr();
  try {
    const doc = await db.collection('work_data').doc(today).get();
    if (doc.exists) {
      const data = doc.data();
      if (JSON.stringify(state) !== JSON.stringify(data.state)) {
        state = data.state;
        startTimes = data.startTimes || {};
        render();
        console.log('🔄 자동 동기화 완료 (다른 PC에서 변경됨)');
      }
    }
  } catch(e) {
    console.error('❌ 자동 동기화 실패:', e);
  }
}, 1000);  // 1초마다

render();
updateClock();
setInterval(updateClock, 1000);
setInterval(() => { updateTimers(); }, 1000);
setInterval(saveState, 5000);  // 5초마다 저장
</script>
